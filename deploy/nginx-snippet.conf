# AI Music Player - Nginx location block
# Add to mirac.site server block BEFORE the catch-all location /

    # AI Music Player - separate entry at /ai-music
    location /ai-music/ {
        proxy_pass http://127.0.0.1:3010/ai-music/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
    }

    location /ai-music/api/stream {
        proxy_pass http://127.0.0.1:3010/ai-music/api/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }
